<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>ALJD1 - AI Chat for World Problems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2128;
      --border: rgba(255,255,255,0.08);
      --text: #e6edf3;
      --muted: #8b949e;
      --primary: #f0a500;
      --primary-dim: rgba(240,165,0,0.15);
      --user-bubble: rgba(240,165,0,0.18);
      --ai-bubble: #1c2128;
      --input-bg: #161b22;
      --sidebar-w: 280px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100dvh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }

    #new-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    #new-btn:hover { opacity: 0.85; }

    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 16px 8px;
    }

    #conv-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }

    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
      border: 1px solid transparent;
    }
    .conv-item:hover { background: rgba(255,255,255,0.05); }
    .conv-item.active { background: rgba(240,165,0,0.12); border-color: rgba(240,165,0,0.25); }

    .conv-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .conv-item.active .conv-title { color: var(--primary); }

    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: none;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .conv-item:hover .del-btn { display: flex; }
    .del-btn:hover { color: #f85149; background: rgba(248,81,73,0.1); }

    .empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 32px 16px; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(13,17,23,0.8);
      backdrop-filter: blur(12px);
    }

    #menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }
    #menu-btn:hover { background: rgba(255,255,255,0.06); }

    .logo { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: 0.04em; }

    .badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    #messages { flex: 1; overflow-y: auto; padding: 24px 20px 0; scroll-behavior: smooth; }

    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      gap: 20px;
    }

    .welcome-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--primary-dim);
      border: 1px solid rgba(240,165,0,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }

    .welcome-title { font-size: clamp(28px, 6vw, 44px); font-weight: 700; line-height: 1.2; }
    .welcome-title span { color: var(--primary); }
